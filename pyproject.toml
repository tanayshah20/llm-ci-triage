[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ci-triage"
version = "0.1.0"
description = "A GitHub Action that explains why a CI run failed and comments on the PR."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
ci-triage = "ci_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_triage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The sandbox files fail on purpose.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Replace YOUR_GITHUB_USERNAME with the account that owns the ci-triage repo.
# workflow_run only fires from the copy of this file on the default branch.
name: CI Triage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: YOUR_GITHUB_USERNAME/ci-triage@main
